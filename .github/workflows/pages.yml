name: Test and publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game rules
        run: npm test
      - name: Validate game files
        run: npm run build
      - name: Package offline game
        run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: offline-game
          path: output/vegas-dice-night.html
      - name: Prepare public files
        run: |
          node -e "const fs=require('fs'),path=require('path');fs.cpSync('dist','_site',{recursive:true,filter:p=>!path.basename(p).startsWith('.')});fs.writeFileSync('_site/.nojekyll','');"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: offline-game
          path: output
      - name: Publish offline download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" output/vegas-dice-night.html --target "$GITHUB_SHA" --title "V$version · 海报大厅与迟归先生" --notes-file RELEASE-V9.md
          fi
